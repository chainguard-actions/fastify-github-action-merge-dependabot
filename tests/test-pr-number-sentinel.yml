name: Test pr-number on workflow_dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pr-number: '1'
          approve-only: 'true'
      - name: Assert action ran (status set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.merge_status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            case "$RESULT" in
              approved|skipped:*) echo "PASS: got '$RESULT'" ;;
              *) echo "FAIL: unexpected merge_status '$RESULT'"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$RESULT" != "merge_failed" ] && [ -n "$RESULT" ]; then
              echo "FAIL: expected merge_failed on failure, got '$RESULT'"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
